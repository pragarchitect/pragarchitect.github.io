# Controleert of de Jekyll-site foutloos bouwt.
# Publiceren gebeurt nog steeds door GitHub Pages zelf; dit is alleen een check,
# vooral nuttig bij pull requests (bijv. van /nieuw-artikel of @claude).
name: Build check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'   # zelfde minor als .ruby-version / GitHub Pages
          bundler-cache: true

      - name: Jekyll build
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      # Interne links, afbeeldingen (incl. alt-tekst) en anchors controleren.
      # Externe links niet: die zijn traag en geven vaak vals alarm.
      - name: Check interne links
        run: |
          gem install html-proofer --no-document
          htmlproofer ./_site --disable-external --no-enforce-https --allow-missing-href
